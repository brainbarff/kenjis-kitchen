name: Deploy Kenji's Kitchen to Hostinger

on:
  push:
    branches:
      - production
  workflow_dispatch:

concurrency:
  group: production-ftps-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: FTPS Deploy to Hostinger
    runs-on: ubuntu-latest

    steps:
      - name: Checkout production branch
        uses: actions/checkout@v4

      - name: Verify PHP syntax before deploy
        run: |
          find . -type f -name '*.php' -not -path './.git/*' -print0 | xargs -0 -n1 php -l

      - name: Install lftp
        run: |
          sudo apt-get update
          sudo apt-get install -y lftp

      - name: Sync files to Hostinger via FTPS (lftp)
        env:
          LFTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_USER: ${{ secrets.FTP_USERNAME }}
          FTP_HOST: ${{ secrets.FTP_SERVER }}
        run: |
          lftp --norc <<LFTP_EOF
          set cmd:fail-exit yes
          set ftp:ssl-allow true
          set ftp:ssl-force true
          set ftp:ssl-protect-data true
          set ssl:verify-certificate no
          set ftp:passive-mode true
          set net:timeout 30
          set net:max-retries 5
          set net:reconnect-interval-base 3
          open --env-password -u "$FTP_USER" -p 21 "ftp://$FTP_HOST"
          set cmd:fail-exit no
          rm -f default.php seed_flash_sale.php .ftp-deploy-sync-state.json
          rm -r -f functions
          set cmd:fail-exit yes
          mirror --reverse --delete --no-perms --parallel=2 --verbose \
            --exclude '^\.well-known/' \
            --exclude '^cgi-bin/' \
            --exclude '^uploads/' \
            --exclude '^\.env' \
            --exclude '^\.git' \
            --exclude '^tests/' \
            --exclude '^tools/' \
            --exclude '^Documentation/' \
            --exclude '^handover/' \
            --exclude '^functions/' \
            --exclude '^node_modules/' \
            --exclude '^public-ordering/' \
            --exclude '^public-admin/' \
            --exclude '\.sql$' \
            --exclude '\.sql\.gz$' \
            --exclude '\.csv$' \
            --exclude '\.bat$' \
            --exclude '\.sh$' \
            --exclude '\.md$' \
            --exclude '\.log$' \
            --exclude '\.bak$' \
            --exclude '\.dump$' \
            --exclude '^seed_flash_sale\.php$' \
            --exclude '^database/seed_.*\.php$' \
            --exclude '^package(-lock)?\.json$' \
            ./ ./
          mirror --reverse --no-perms --parallel=2 --verbose \
            --exclude '^avatars/' \
            --exclude '^payment_proofs/' \
            --exclude '^private_proofs/' \
            uploads/ uploads/
          bye
          LFTP_EOF
