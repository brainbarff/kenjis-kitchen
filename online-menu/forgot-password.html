<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Forgot Password – Kenji's Kitchen</title>
  <link rel="icon" type="image/png" href="../assets/img/logo.png">
  <link rel="apple-touch-icon" href="../assets/img/logo.png">
  <link rel="stylesheet" href="../../assets/css/ol.css">
</head>
<body class="auth-page-body">

  <div class="auth-page-card">

    <!-- Logo -->
    <div class="auth-page-logo-wrap">
      <img src="../assets/img/logo.png" alt="Kenji's Kitchen Logo">
      <h1>Kenji's Kitchen</h1>
      <span>Authentic Flavors · Fairview</span>
    </div>

    <p class="auth-page-title">Forgot your password?</p>
    <p class="auth-page-sub">
      Enter your registered email and we'll send you a secure reset link valid for 45 minutes.
    </p>

    <!-- Alert box (success / error) -->
    <div class="auth-page-alert" id="alertBox" role="alert"></div>

    <!-- Form -->
    <div id="formWrap">
      <div class="auth-page-field">
        <label for="emailInput">Email Address</label>
        <input
          type="email"
          id="emailInput"
          class="auth-page-input"
          placeholder="name@example.com"
          autocomplete="email"
          required
        >
      </div>

      <button type="button" class="auth-page-btn" id="submitBtn" onclick="submitForgot()">
        Send Reset Link
      </button>
    </div>

    <a href="index.php" class="auth-page-back-link">← Back to Ordering Store</a>
  </div>

  <script>
    async function submitForgot() {
      var email   = document.getElementById('emailInput').value.trim();
      var btn     = document.getElementById('submitBtn');
      var alert   = document.getElementById('alertBox');

      hideAlert();

      if (!email || !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
        showAlert('error', 'Please enter a valid email address.');
        return;
      }

      btn.disabled    = true;
      btn.textContent = 'Sending…';

      try {
        var res  = await fetch('api/forgot_password.php', {
          method:  'POST',
          headers: { 'Content-Type': 'application/json' },
          body:    JSON.stringify({ email: email })
        });
        var data = await res.json();

        if (data.status === 'success') {
          showAlert('success', data.message ||
            "If an account with that email exists, we've sent reset instructions.");
          document.getElementById('formWrap').style.display = 'none';
        } else {
          showAlert('error', data.message || 'Something went wrong. Please try again.');
          btn.disabled    = false;
          btn.textContent = 'Send Reset Link';
        }
      } catch (e) {
        showAlert('error', 'Could not reach the server. Please try again.');
        btn.disabled    = false;
        btn.textContent = 'Send Reset Link';
      }
    }

    function showAlert(type, msg) {
      var el = document.getElementById('alertBox');
      el.className   = 'auth-page-alert ' + type;
      el.textContent = msg;
      el.style.display = 'block';
    }

    function hideAlert() {
      var el = document.getElementById('alertBox');
      el.style.display = 'none';
    }

    // Submit on Enter
    document.addEventListener('keydown', function(e) {
      if (e.key === 'Enter') submitForgot();
    });
  </script>
</body>
</html>
