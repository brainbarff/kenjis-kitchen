<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Reset Password – Kenji's Kitchen</title>
  <link rel="icon" type="image/png" href="../assets/img/logo.png">
  <link rel="apple-touch-icon" href="../assets/img/logo.png">
  <link rel="stylesheet" href="../../assets/css/ol.css">
</head>
<body class="auth-page-body">

  <div class="auth-page-card">

    <!-- Logo -->
    <div class="auth-page-logo-wrap">
      <img src="../assets/img/logo.png" alt="Kenji's Kitchen Logo">
      <h1>Kenji's Kitchen</h1>
      <span>Authentic Flavors · Fairview</span>
    </div>

    <p class="auth-page-title">Set a new password</p>
    <p class="auth-page-sub">
      Choose a strong password (at least 8 characters).
    </p>

    <!-- Alert box (success / error) -->
    <div class="auth-page-alert" id="alertBox" role="alert"></div>

    <!-- Form (hidden after success) -->
    <div id="formWrap">
      <!-- New password -->
      <div class="auth-page-field">
        <label for="pwInput">New Password</label>
        <div class="pw-wrap">
          <input
            type="password"
            id="pwInput"
            class="auth-page-input pw-input"
            placeholder="At least 8 characters"
            autocomplete="new-password"
          >
          <button type="button" class="pw-eye-btn" aria-label="Show password"
                  onclick="togglePwPage('pwInput', this)">
            <svg class="eye-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"
                 fill="none" stroke="currentColor" stroke-width="2"
                 stroke-linecap="round" stroke-linejoin="round">
              <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
              <circle cx="12" cy="12" r="3"/>
            </svg>
            <svg class="eye-off-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"
                 fill="none" stroke="currentColor" stroke-width="2"
                 stroke-linecap="round" stroke-linejoin="round" style="display:none">
              <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/>
              <line x1="1" y1="1" x2="23" y2="23"/>
            </svg>
          </button>
        </div>
      </div>

      <!-- Confirm password -->
      <div class="auth-page-field">
        <label for="pwConfirmInput">Confirm Password</label>
        <div class="pw-wrap">
          <input
            type="password"
            id="pwConfirmInput"
            class="auth-page-input pw-input"
            placeholder="Repeat your new password"
            autocomplete="new-password"
          >
          <button type="button" class="pw-eye-btn" aria-label="Show password"
                  onclick="togglePwPage('pwConfirmInput', this)">
            <svg class="eye-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"
                 fill="none" stroke="currentColor" stroke-width="2"
                 stroke-linecap="round" stroke-linejoin="round">
              <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
              <circle cx="12" cy="12" r="3"/>
            </svg>
            <svg class="eye-off-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"
                 fill="none" stroke="currentColor" stroke-width="2"
                 stroke-linecap="round" stroke-linejoin="round" style="display:none">
              <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/>
              <line x1="1" y1="1" x2="23" y2="23"/>
            </svg>
          </button>
        </div>
      </div>

      <button type="button" class="auth-page-btn" id="submitBtn" onclick="submitReset()">
        Reset Password
      </button>
    </div>

    <!-- Shown after success -->
    <div id="successActions" style="display:none; text-align:center; margin-top: 20px;">
      <a href="index.php" class="auth-page-btn" style="display:inline-block; text-decoration:none; width:100%;">
        Sign In Now →
      </a>
    </div>

    <a href="forgot-password.html" class="auth-page-back-link" id="backLink">
      ← Request a new reset link
    </a>
  </div>

  <script>
    // ── Eye toggle ────────────────────────────────────────────────────────────
    function togglePwPage(inputId, btn) {
      var inp    = document.getElementById(inputId);
      var eyeOn  = btn.querySelector('.eye-icon');
      var eyeOff = btn.querySelector('.eye-off-icon');
      if (inp.type === 'password') {
        inp.type = 'text';
        eyeOn.style.display  = 'none';
        eyeOff.style.display = '';
        btn.setAttribute('aria-label', 'Hide password');
      } else {
        inp.type = 'password';
        eyeOn.style.display  = '';
        eyeOff.style.display = 'none';
        btn.setAttribute('aria-label', 'Show password');
      }
    }

    // ── Read token from URL ───────────────────────────────────────────────────
    var _token = (new URLSearchParams(window.location.search)).get('token') || '';

    if (!_token) {
      showAlert('error',
        'No reset token found in the URL. ' +
        '<a href="forgot-password.html" style="color:#F2C12E;">Request a new link</a>.');
      document.getElementById('formWrap').style.display = 'none';
      document.getElementById('backLink').style.display = 'none';
    }

    // ── Submit ────────────────────────────────────────────────────────────────
    async function submitReset() {
      var pw      = document.getElementById('pwInput').value;
      var pwConf  = document.getElementById('pwConfirmInput').value;
      var btn     = document.getElementById('submitBtn');

      hideAlert();

      if (pw.length < 8) {
        showAlert('error', 'Password must be at least 8 characters.');
        return;
      }
      if (pw !== pwConf) {
        showAlert('error', 'Passwords do not match.');
        return;
      }

      btn.disabled    = true;
      btn.textContent = 'Resetting…';

      try {
        var res  = await fetch('api/reset_password.php', {
          method:  'POST',
          headers: { 'Content-Type': 'application/json' },
          body:    JSON.stringify({
            token:            _token,
            password:         pw,
            confirm_password: pwConf
          })
        });
        var data = await res.json();

        if (data.status === 'success') {
          showAlert('success', '✔ ' + (data.message || 'Password reset successfully!'));
          document.getElementById('formWrap').style.display    = 'none';
          document.getElementById('successActions').style.display = 'block';
          document.getElementById('backLink').style.display   = 'none';
        } else {
          var msg = data.message || 'Something went wrong. Please try again.';
          if (data.expired) {
            msg += ' <a href="forgot-password.html" style="color:#F2C12E;">Request a new link</a>';
          }
          showAlert('error', msg);
          btn.disabled    = false;
          btn.textContent = 'Reset Password';
        }
      } catch (e) {
        showAlert('error', 'Could not reach the server. Please try again.');
        btn.disabled    = false;
        btn.textContent = 'Reset Password';
      }
    }

    function showAlert(type, html) {
      var el = document.getElementById('alertBox');
      el.className     = 'auth-page-alert ' + type;
      el.innerHTML     = html;
      el.style.display = 'block';
    }
    function hideAlert() {
      document.getElementById('alertBox').style.display = 'none';
    }
  </script>
</body>
</html>
