<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Customer Login - Kenji's Kitchen</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="../../assets/css/online-ordering.css">
    <style>
        body.login-standalone-body {
            min-height: 100vh;
            background: #F9F9F9;
            display: flex;
            flex-direction: column;
            margin: 0;
            padding: 24px;
            box-sizing: border-box;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            color: #2F2F2F;
        }

        .login-top-nav {
            max-width: 1100px;
            width: 100%;
            margin: 0 auto 20px;
        }

        .back-home-pill {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 8px 18px;
            background: #FFFFFF;
            border: 1px solid #EAEAEA;
            border-radius: 999px;
            color: #2F2F2F;
            font-size: 13px;
            font-weight: 600;
            text-decoration: none;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.04);
            transition: all 0.2s ease;
        }

        .back-home-pill:hover {
            background: #F4F4F4;
            color: #232323;
            border-color: #D1D5DB;
            transform: translateX(-2px);
        }

        .login-center-container {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
        }

        .split-auth-card.standalone {
            width: 100%;
            max-width: 860px;
            box-shadow: 0 24px 64px rgba(0, 0, 0, 0.08);
            margin: 0 auto;
        }
    </style>
</head>
<body class="login-standalone-body">

    <div class="login-top-nav">
        <a href="index.html" class="back-home-pill">
            <i class="bi bi-arrow-left"></i> Back to Home
        </a>
    </div>

    <div class="login-center-container">
        <section class="auth-modal split-auth-card standalone" id="authCard">
            <!-- Left Side: Branded Welcome Panel -->
            <div class="auth-banner" id="authBanner">
                <div class="auth-brand-badge">
                    <img src="../../assets/img/logo.jpg" alt="Kenji's Kitchen Logo" class="auth-logo-img">
                </div>
                <h2 class="auth-banner-title" id="authBannerTitle">Hello, Welcome!</h2>
                <p class="auth-banner-sub" id="authBannerSub">Don't have an account?</p>
                <button type="button" class="auth-switch-btn" id="authSwitchBtn">Register Now!</button>
            </div>

            <!-- Right Side: Clean Form Panel -->
            <div class="auth-form-wrap">
                <div class="auth-form-header">
                    <h2 id="authFormTitle">Customer Login</h2>
                    <div class="auth-title-line"></div>
                </div>

                <!-- Sign In Form -->
                <form id="signInForm" class="auth-form">
                    <div class="auth-field">
                        <label for="signInEmail">Username, Email, or Phone</label>
                        <div class="auth-input-group">
                            <i class="bi bi-person auth-input-icon"></i>
                            <input type="text" id="signInEmail" placeholder="Enter username, email, or phone" required autocomplete="username" autofocus>
                        </div>
                    </div>

                    <div class="auth-field">
                        <div class="field-header">
                            <label for="signInPassword">Password</label>
                            <a href="#" class="forgot-link" onclick="alert('Please approach our store staff or contact us via hotline 0912-345-6789 to reset your password.'); return false;">Forgot Password?</a>
                        </div>
                        <div class="auth-input-group">
                            <i class="bi bi-lock auth-input-icon"></i>
                            <input type="password" id="signInPassword" placeholder="Enter your password" required autocomplete="current-password">
                            <button type="button" class="toggle-password" data-target="signInPassword" aria-label="Toggle password visibility">
                                <i class="bi bi-eye"></i>
                            </button>
                        </div>
                    </div>

                    <small class="field-error" id="signInError"></small>

                    <button class="primary-btn auth-submit-btn" type="submit" id="signInBtn">LOGIN</button>

                    <div class="auth-divider">
                        <span>OR</span>
                    </div>

                    <a href="index.html#menuSection" class="guest-skip-btn" style="text-decoration:none;">
                        <i class="bi bi-person-badge"></i> Continue as Guest
                    </a>
                </form>

                <!-- Register Form -->
                <form id="registerForm" class="auth-form" hidden>
                    <div class="auth-field">
                        <label for="registerName">Full Name</label>
                        <div class="auth-input-group">
                            <i class="bi bi-person auth-input-icon"></i>
                            <input type="text" id="registerName" placeholder="Juan Dela Cruz" required autocomplete="name">
                        </div>
                    </div>

                    <div class="auth-field">
                        <label for="registerEmail">Email Address</label>
                        <div class="auth-input-group">
                            <i class="bi bi-envelope auth-input-icon"></i>
                            <input type="email" id="registerEmail" placeholder="juan@example.com" required autocomplete="email">
                        </div>
                    </div>

                    <div class="auth-field">
                        <label for="registerPhone">Phone Number</label>
                        <div class="auth-input-group">
                            <i class="bi bi-telephone auth-input-icon"></i>
                            <input type="tel" id="registerPhone" placeholder="09XXXXXXXXX" maxlength="11" required autocomplete="tel">
                        </div>
                    </div>

                    <div class="auth-field">
                        <label for="registerPassword">Password</label>
                        <div class="auth-input-group">
                            <i class="bi bi-lock auth-input-icon"></i>
                            <input type="password" id="registerPassword" minlength="6" placeholder="At least 6 characters" required autocomplete="new-password">
                            <button type="button" class="toggle-password" data-target="registerPassword" aria-label="Toggle password visibility">
                                <i class="bi bi-eye"></i>
                            </button>
                        </div>
                    </div>

                    <div class="auth-field">
                        <label for="registerAddress">Delivery Address <small>(Optional)</small></label>
                        <div class="auth-input-group textarea-group">
                            <i class="bi bi-geo-alt auth-input-icon"></i>
                            <textarea id="registerAddress" placeholder="Street, barangay, landmarks" rows="2"></textarea>
                        </div>
                    </div>

                    <small class="field-error" id="registerError"></small>

                    <button class="primary-btn auth-submit-btn" type="submit" id="registerBtn">REGISTER</button>

                    <div class="auth-divider">
                        <span>OR</span>
                    </div>

                    <a href="index.html#menuSection" class="guest-skip-btn" style="text-decoration:none;">
                        <i class="bi bi-person-badge"></i> Continue as Guest
                    </a>
                </form>
            </div>
        </section>
    </div>

    <script>
        const API_BASE = './api';
        let currentTab = 'signin';

        const authBannerTitle = document.getElementById('authBannerTitle');
        const authBannerSub = document.getElementById('authBannerSub');
        const authSwitchBtn = document.getElementById('authSwitchBtn');
        const authFormTitle = document.getElementById('authFormTitle');
        const signInForm = document.getElementById('signInForm');
        const registerForm = document.getElementById('registerForm');

        function setAuthMode(mode) {
            currentTab = mode;
            const isSignIn = mode === 'signin';

            if (isSignIn) {
                authBannerTitle.textContent = 'Hello, Welcome!';
                authBannerSub.textContent = "Don't have an account?";
                authSwitchBtn.textContent = 'Register Now!';
                authFormTitle.textContent = 'Customer Login';
                signInForm.hidden = false;
                registerForm.hidden = true;
                document.getElementById('signInEmail')?.focus();
            } else {
                authBannerTitle.textContent = 'Welcome Back!';
                authBannerSub.textContent = 'Already have an account?';
                authSwitchBtn.textContent = 'Sign In!';
                authFormTitle.textContent = 'Create Account';
                signInForm.hidden = true;
                registerForm.hidden = false;
                document.getElementById('registerName')?.focus();
            }
        }

        authSwitchBtn.addEventListener('click', () => {
            setAuthMode(currentTab === 'signin' ? 'register' : 'signin');
        });

        // Password visibility toggle
        document.querySelectorAll('.toggle-password').forEach(btn => {
            btn.addEventListener('click', (e) => {
                e.preventDefault();
                const targetId = btn.dataset.target;
                const input = document.getElementById(targetId);
                if (!input) return;
                const icon = btn.querySelector('i');
                if (input.type === 'password') {
                    input.type = 'text';
                    if (icon) {
                        icon.classList.remove('bi-eye');
                        icon.classList.add('bi-eye-slash');
                    }
                } else {
                    input.type = 'password';
                    if (icon) {
                        icon.classList.remove('bi-eye-slash');
                        icon.classList.add('bi-eye');
                    }
                }
            });
        });

        // Sign In submission
        signInForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const err = document.getElementById('signInError');
            err.textContent = '';
            const btn = document.getElementById('signInBtn');
            btn.disabled = true;
            btn.textContent = 'LOGGING IN...';

            try {
                const res = await fetch(`${API_BASE}/auth.php?action=login`, {
                    method: 'POST',
                    credentials: 'same-origin',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        email: document.getElementById('signInEmail').value.trim(),
                        password: document.getElementById('signInPassword').value
                    })
                });
                const data = await res.json().catch(() => ({ status: 'error', message: 'Invalid response from server.' }));

                if (data.status !== 'success') {
                    err.textContent = data.message || 'Login failed.';
                    btn.disabled = false;
                    btn.textContent = 'LOGIN';
                    return;
                }

                // Successful login -> Redirect back to ordering page
                window.location.href = 'index.html';
            } catch (error) {
                err.textContent = 'Unable to connect to the authentication server.';
                btn.disabled = false;
                btn.textContent = 'LOGIN';
            }
        });

        // Registration submission
        registerForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const err = document.getElementById('registerError');
            err.textContent = '';
            const btn = document.getElementById('registerBtn');
            btn.disabled = true;
            btn.textContent = 'CREATING ACCOUNT...';

            try {
                const res = await fetch(`${API_BASE}/auth.php?action=register`, {
                    method: 'POST',
                    credentials: 'same-origin',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        full_name: document.getElementById('registerName').value.trim(),
                        email: document.getElementById('registerEmail').value.trim(),
                        phone: document.getElementById('registerPhone').value.trim(),
                        address: document.getElementById('registerAddress').value.trim(),
                        password: document.getElementById('registerPassword').value
                    })
                });
                const data = await res.json().catch(() => ({ status: 'error', message: 'Invalid response from server.' }));

                if (data.status !== 'success') {
                    err.textContent = data.message || 'Registration failed.';
                    btn.disabled = false;
                    btn.textContent = 'REGISTER';
                    return;
                }

                // Successful registration -> Redirect back to ordering page
                window.location.href = 'index.html';
            } catch (error) {
                err.textContent = 'Unable to connect to the authentication server.';
                btn.disabled = false;
                btn.textContent = 'REGISTER';
            }
        });
    </script>
</body>
</html>
